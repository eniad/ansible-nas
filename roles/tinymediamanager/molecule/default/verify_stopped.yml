---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - include_vars:
        file: ../../defaults/main.yml

    - name: Try and stop and remove TinyMediaManager
      docker_container:
        name: "{{ tinymediamanager_container_name }}"
        state: absent
      register: result

    - name: Check TinyMediaManager is stopped
      assert:
        that:
          - not result.changed
